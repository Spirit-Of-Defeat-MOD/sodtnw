gansu_crisis: "Crisis in the Northwest"
gansu_crisis_desc: "Gansu, the land where one watches the bright moon rises from the Tianshan Mountains, In an ocean of clouds, vast and dim. Alas in this ancient frontier fortune has not been on the side of the populace. The 1920 Haiyuan earthquake shattered the political and social order of the province. Not only was the province left in economic ruin, but the decapitation of islamic leadership following the death of Ma Yuanzhang and his son a bridge between Beijing and its Muslim populace has collapse. Now the vaccum is being filled by various groups aiming to be not only the spiritual leaders of the Hui, but also ensuring their rivals cannot usurp any status they have gained. While the aggressive taxation policy to fund wars has stopped since Feng's unification, The social breakdown along with the continued cultivation of opium has left the province in a tense status quo."
 
