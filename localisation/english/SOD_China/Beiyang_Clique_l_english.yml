ROC_fall_of_the_republic:0 "Fall of the Republic"
ROC_fall_of_the_republic_desc:0 "Today marks a critical juncture in the history of China. Feng Yuxiang, the man at the helm of the Beiyang Republic, finds himself in a precarious position, his authority wavering day by day. Down south, a storm is brewing. The nationalists, with the southern warlords in tow, are gearing up for a one final push. In the north, the once steadfast northern warlords are now fanning the flames of rebellion. The end of the Beiyang Repbublic is near.\n\n\n[ROC_collapse_phase]"
