§!  Culture Icon Review  §WNormal§!  §g(Art Reviews, Art, To do)§!\n  §G8d 12h§!  §HRR-0250§!  Implement Indonesia's regional-capital loss and faction cascade  §WNormal§!  §g(Indonesia, Mechanic, To do)§!\n      §gMike:§! From the Dev VC 2026-08-27  Java Runtime: Colonial Exception. Source specifies that capturing regional capitals breaks Dutch control and creates further factions, including foreign-aligned ones. This refines July 2025's earlier speculative regional-resource ideas. Source: Dev VC 2026-08-27. Historical proposal: confirm current relevance and completion before committing.\n  §G7d 3h§!  §HRR-0283§!  Danish Minority Review  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 37: Hovedstaden; 99: Jutland; 887: Zealand; 905: Northern Jutland; 910: Bornholm; 911: Northern Schleswig; 1173: Schleswig; 1908: Funen; 2611: Kastrup / Denmark is old, and could do with a look over to have more spread. It has parts of Schleswig but they're all German. / Review reasons: Needs Minorities\n  §G7d 0h§!  §HRR-0284§!  Floridian Culture  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 366: Southern Florida; 1162: Florida Panhandle; 1171: Central Florida; 2441: Jacksonville / Needs adding with an Event. Potentially based on Urbanisation/Internal Migration. Have it slowly start from South Florida and move upwards.\n  §G7d 0h§!  §HRR-0285§!  Review Budapest (state 43)  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 43: Budapest / Jewish Minority Needed (Liberal IIRC) / Review reasons: Needs Minorities\n  §G7d 0h§!  §HRR-0286§!  Jewish Ukraine  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 93: Volhynia; 192: Odessa; 194: Mozyr; 198: Vinnytsia; 199: Khmelnytskyi; 201: Zhytomyr; 202: Kiev; 203: Cherkasy; 856: Ternopil; 2033: Voznesensk; 2034: Kamianets-Podilskyi; 2036: Rivne; 2037: Bila Tserkva / Potentially needs more Jews. Needs discussing which ones would still have them considering Jewish Oblast. / Review reasons: Unsure Placement, Needs Lore Update\n  §G7d 0h§!  §HRR-0287§!  Sami Migratory?  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 666: Lappland; 881: Finnmark; 884: Troms; 1919: Norrbotten; 1920: Kiruna; 1921: Northern Scandes; 1932: Kárášjohka; 1993: Northern Siikajoki / Do we make the Sami in the area migratory, would require majority group migration mechanics. / Review reasons: Needs Lore Update\n  §G7d 0h§!  §HRR-0288§!  Berlin  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 1978: Western Berlin; 1979: Eastern Berlin / Berlin needs some minorities, rn it's a monoculture. PROBABLY NOT JEWS NOT THAT MANY HERE. / Review reasons: Needs Minorities\n  §G7d 0h§!  §HRR-0289§!  Review Amsterdam (state 2590)  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 2590: Amsterdam / 79k Jews in Amsterdam 1930s. Potentially more by the 60s. Give them an interesting branch tbh / Review reasons: Needs Minorities\n  §G7d 0h§!  §HRR-0290§!  Makedon Jewish Belt  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Flagged for Review in Culture Master by Mike (culture). / States: 731: Pella; 1941: Bregalnica; 1954: Rhodope Mountains / There was apparently jews in this area, check the numbers. / Review reasons: Needs Minorities\n  §G7d 0h§!  §HRR-0294§!  Add Migratory Cultures to the Map  §WNormal§!  §g(Culture System, Data, To do)§!\n  §G7d 0h§!  §HRR-0295§!  Review idea: Explorer Mechanic for Finding Crystals  §WNormal§!  §g(Time Bombs, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Explorer Mechanic for Finding Crystals / Category: Mechanics / Posted by Mike. / RR-0164 Explorer Mechanic for Finding Crystals needs fleshing out before anyone goes on with it.\n  §G6d 16h§!  §HRR-0304§!  Review idea: Switcheable Tech Trees based on Alignment  §WNormal§!  §g(Tech, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Switcheable Tech Trees based on Alignment / Category: Generics / Posted by Mike. / We should explore to see if this is possible - posted for Steve\n  §G6d 2h§!  §HRR-0320§!  Regional Cultures Review  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gNilo:§! Flagged for Review in Culture Master by Nilo (culture). / States: 283: Gansu; 604: Xinghai; 616: Lanshan; 755: Qaidam; 1711: Xining; 1712: Huangnang; 1720: Hoh Xil Shan; 1723: Shule Nanshan; 1724: Ngola Shan; 2025: Xincheng; 2241: Tianshui; 2556: Dingxi / Ma Clique punishes buddhists while allowing daoists because of necessity. / Review reasons: Needs Minorities, Needs Lore Update\n  §G6d 2h§!  §HRR-0321§!  Regional Cultures Review  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gNilo:§! Flagged for Review in Culture Master by Nilo (culture). / States: 617: Bayangol; 618: Tarbagatai; 1704: Turfan; 2523: Tihwa; 2524: Changki / Add state atheism as national religion. / Review reasons: Needs Minorities, Needs Lore Update\n  §G6d 2h§!  §HRR-0323§!  Regional Cultures Review  §WNormal§!  §g(Culture System, Culture, To do)§!\n      §gNilo:§! Flagged for Review in Culture Master by Nilo (religion). / States: 2230: Tongren; 2236: Qianxinan / Add Hero Veneration religion for Southern Guardians / Review reasons: Needs Minorities, Needs Lore Update\n  §G5d 19h§!  §HRR-0308§!  Review idea: Review Coverage map  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Review Coverage map / Category: Tools & Workflow / Posted by Claude. / A whole-map view of which regions have been reviewed: every state coloured by its review status, using the snapshots the state reviews already carry through Live Sync. / - Green: approved; blue: changed since approval; amber: flagged, waiting; grey: never reviewed. / - A layer switch for culture / religion / language reviews, and country reviews shaded by country. / - Click a state to open its review task (or flag it for review if it has none). / - A small summary: % of states reviewed per continent / culture group, and the oldest approvals. / - Copy for Discord: ''Review coverage: 41% of Asia reviewed, 12 states changed since approval''. / Suggested by Claude (2026-10-23), from the tools expansion list.\n  §G5d 19h§!  §HRR-0309§!  Review idea: Focus Master: a visual focus tree editor  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Focus Master: a visual focus tree editor / Category: Tools & Workflow / Posted by Claude. / A Master for national focus trees, like Culture Master is for cultures. / - Opens any tree from common/national_focus and draws it as the game does (positions, prerequisite and mutually exclusive lines, icons from their GFX). / - Drag focuses to move them (relative_position_id kept), right-click to add / link / unlink, edit names and descriptions in place (loc written next to them). / - Checks: missing icons, missing loc, overlapping focuses, unreachable focuses, broken prerequisites. / - Flag a focus for review straight into the To Do, like Culture Master's states. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0310§!  Review idea: Event Chain Viewer  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Event Chain Viewer / Category: Tools & Workflow / Posted by Claude. / Every event drawn as a graph: which option fires which event (country_event, news events, on_actions, decisions). / - Spot dead ends, events nothing fires, options with no effect, missing pictures and loc. / - Click an event to read its text and options as the player sees them. / - 'Fire it in game': copies the console command (event x.y TAG) for testing. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0312§!  Review idea: One-click Test Launch  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: One-click Test Launch / Category: Tools & Workflow / Posted by Claude. / Launch HOI4 with RR for testing from Organisation Master. / - Pick a country and start date; launches with -debug_mode, optionally straight into that country. / - Saved sets of console commands to run on load (e.g. 'all culture map modes', 'fire the Stallone bomb'). / - Times the load, counts new errors (with the Error Log Watcher) and keeps a small history per build. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0313§!  Review idea: Localisation Checker  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Localisation Checker / Category: Tools & Workflow / Posted by Claude. / Finds loc problems before the game does. / - Missing keys (used in script / GUI, never defined), unused keys, duplicates across files. / - Files without the UTF-8 BOM, broken colour codes (Y without !), unescaped quotes. / - Fix buttons for the safe ones (add the BOM, close a colour code), the rest as a list to jump to. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0314§!  Review idea: GFX & Sprite Checker  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: GFX & Sprite Checker / Category: Tools & Workflow / Posted by Claude. / Keeps interface/*.gfx and gfx/ in line. / - Sprites pointing at missing textures, textures no sprite uses, duplicated sprite names. / - Wrong sizes or DDS formats for their kind (focus icons, idea icons, portraits, flags). / - A converter: drop a PNG, get a correctly sized DDS and its sprite entry (ties in with the Needs Icon/Art descriptor: art added to a task can be turned into the in-game file). / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0315§!  Review idea: Map Rules Checker  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Map Rules Checker / Category: Tools & Workflow / Posted by Claude. / Catches the map mistakes that give 'Failed to load the map' with no reason. / - Province bitmap vs definition.csv, X-crossings, the map seam, states with provinces in two regions, strategic / naval regions that aren't contiguous, supply nodes and railways on missing provinces. / - Shows each problem on the map; runs before a commit that touches map/. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0316§!  Review idea: Release Packager  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Release Packager / Category: Tools & Workflow / Posted by Claude. / Builds a player release from the dev repository. / - Copies the mod without tools/, Templates/, dev-only files; switches the dev To Do window off (rr_todo_enabled). / - Bumps the version in descriptor.mod, checks the supported game version. / - Writes player-facing patch notes from completed To Do tasks and Monthly Reports since the last release, for you to edit, then zips it ready for the Workshop. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0317§!  Review idea: RR Search  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: RR Search / Category: Tools & Workflow / Posted by Claude. / A search that understands Paradox script. / - Find where a token, flag, variable or idea is set, checked, added, removed - grouped by kind, not just text hits. / - 'Where does global.extinct_cultures get used?' answered with each place and its scope. / - Click a result to open the file at that line; save a search to a To Do task. / Suggested by Claude (2026-10-23).\n  §G5d 19h§!  §HRR-0318§!  Review idea: Credits & Sources Master  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Credits & Sources Master / Category: Tools & Workflow / Posted by Claude. / One place for where every song, picture, portrait and model came from. / - Fills itself from Music Master (song links), idea pictures, portrait reviews and the landmark models. / - Marks what's original, AI-made, licensed or unknown; flags unknowns before a release. / - Writes the credits / AI disclosure text for the Workshop page. / Suggested by Claude (2026-10-23).\n  §G5d 10h§!  §HRR-0333§!  Define the China-first release checklist and deferred systems  §WNormal§!  §g(China, Content, To do)§!\n      §gMike:§! From the Dev VC 2026-03-15  Honey, I Shrunk the Release. Use the exact country roster in the original notes, including Japan. Do not treat earlier Stage 2 summer plans as current deadlines. Source: Dev VC 2026-03-15. Historical proposal: confirm current relevance and completion before committing.\n  §G5d 10h§!  §HRR-0334§!  China Requires two-timebomb and one-mythbomb  §WNormal§!  §g(Time Bombs, Content, To do)§!\n      §gMike:§! From the Dev VC 2026-03-15  Honey, I Shrunk the Release. Narrow release-scoping work linked to existing RR-0160 and RR-0162, not replacement tasks for those systems. Source: Dev VC 2026-03-15. Historical proposal: confirm current relevance and completion before committing.\n  §G5d 10h§!  §HRR-0335§!  Make Japan's civil war unavoidable in the initial release  §WNormal§!  §g(Japan, Content, To do)§!\n      §gMike:§! From the Dev VC 2026-03-15  Honey, I Shrunk the Release. Explicit note attached to Japan in the release roster. Source: Dev VC 2026-03-15. Historical proposal: confirm current relevance and completion before committing.\n  §G5d 10h§!  §HRR-0338§!  Rework the remaining interface while retaining the politics-menu design  §WNormal§!  §g(Polish, Tools, To do)§!\n      §gMike:§! From the Dev VC 2026-03-15  Honey, I Shrunk the Release. Source says UI needs reworking and identifies the politics menu as already good. Source: Dev VC 2026-03-15. Historical proposal: confirm current relevance and completion before committing.\n  §G5d 10h§!  §HRR-0339§!  Adjust victory-point visibility by map zoom level  §WNormal§!  §g(Polish, Map, To do)§!\n      §gMike:§! From the Dev VC 2026-03-15  Honey, I Shrunk the Release. Direct VP visibility request from this meeting. Source: Dev VC 2026-03-15. Historical proposal: confirm current relevance and completion before committing.\n  §G4d 14h§!  §HRR-0681§!  🔁 Rework Generics (76 waiting in 🖼 GFX)  §WNormal§!  §g(Art Reviews, Art, To do)§!\n      §gWith Mike, Nilo§!\n      §gMike:§! 76 generics marked for rework: Needs Severe Recorrection 47, Needs Touchup 17, Something about it 12. / They're in 🖼 GFX > 🔁 Needs Rework: claim one there, ✓ Reworked when done. Mark more in Country Master (right-click a portrait) or in GFX (right-click a picture).\n  §G4d 14h§!  §HRR-0682§!  🔁 Rework Portraits (122 waiting in 🖼 GFX)  §WNormal§!  §g(Art Reviews, Art, To do)§!\n      §gWith Mike, Nilo§!\n      §gMike:§! 122 portraits marked for rework: Needs Touchup 68, Something about it 46, Needs Severe Recorrection 8. / They're in 🖼 GFX > 🔁 Needs Rework: claim one there, ✓ Reworked when done. Mark more in Country Master (right-click a portrait) or in GFX (right-click a picture).\n  §G4d 11h§!  §HRR-0688§!  Fix the Chinese supply route decisions (Burma Road, Ledo Road, The Hump, Hanoi)  §WNormal§!  §g(China, Events, To do)§!\n      §gClaude:§! Hashed out 2026-10-06 in common/decisions/_generic_decisions.txt (category foreign_support): CHI_close_burma_road, CHI_reopen_burma_road, CHI_close_ledo_road, CHI_close_the_hump, CHI_reopen_the_hump, CHI_close_hanoi_route (CHI_reopen_ledo_road was already hashed out). / Why: they fire vanilla Waking the Tiger events that aren't in the mod (events/ is a replace_path): wtt_burma_road.2/.3/.4, wtt_ledo_road.2, wtt_the_hump.2/.3/.4, wtt_hanoi_route.2 (vanilla events/WTT_China.txt). / To fix: rework them for 1964 or port the events (plus loc and pictures), then un-hash. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0689§!  Add the Panama Canal news events (wtt_news.41 / .43)  §WNormal§!  §g(Polish, Events, To do)§!\n      §gClaude:§! common/decisions/_generic_decisions.txt: blow_panama_canal calls wtt_news.41, rebuild_panama_canal calls wtt_news.43. Those vanilla Waking the Tiger news events (vanilla events/WTT_NewsEvents.txt) aren't in the mod, so the decisions work but the news event silently doesn't fire. / To fix: copy them into events/WTT_NewsEvents.txt like the Suez ones (wtt_news.40/.42, done 2026-10-06). Loc and picture already load from the base game. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0690§!  Write the missing event rrtimebombgeneric.12  §WNormal§!  §g(Time Bombs, Events, To do)§!\n      §gClaude:§! Called from common/scripted_effects/RR_time_bomb_effects.txt, expedition_next_stage_generic_1 (fires at expedition_stage = 1), but never written. The namespace exists in events/RR_timebomb.txt. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0691§!  Write the missing events RR_formables_news.2 and .4  §WNormal§!  §g(Formables, Events, To do)§!\n      §gClaude:§! Called but never written: / - RR_formables_news.2: common/decisions/RR_formable_nation_decisions.txt, form_rio_de_la_plata_militarily. / - RR_formables_news.4: same file, form_peru_bolivia_militarily_ecuador. / Write them in events/RR_formables.txt. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0692§!  Make the 2 missing ideology icons  §WNormal§!  §g(Polish, Art, To do)§!\n      §gClaude:§! interface/rr_ideologies.gfx points at files that don't exist: / - GFX_ideology_libertarian_socialism_transhumanism (line ~419) -> gfx/interface/ideologies/libertarian_socialism_transhumanism.dds / - GFX_ideology_neutrality_oligarch_libetarian (line ~617) -> gfx/interface/ideologies/neutrality_oligarch_libetarian.dds (note the ''libetarian'' spelling: check it matches the ideology name before making the art). / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0700§!  Check the dual leader conversion (in game + decisions)  §WNormal§!  §g(Dual Leaders, Data, To do)§!\n      §gClaude:§! Converted 2026-10-25, not tested in game yet. The old hashed-out list in common/scripted_localisation/dual_leader_scripted_loc.txt (255 names / 257 portraits) is now Globus's system: each country history sets set_variable = { dual_leader_<dem|com|aut|nat> = token:<character id> }. 290 countries got lines. / - Each dual leader is a character: its id is the token (common/synchronized_dynamic_tokens/tokens.txt), <id> its name, GFX_<id> its portrait. Existing characters were reused where the name matched. / - 83 had no character: made name + portrait only characters, marked ''#Dual Leader (converted from the old dual leader list)'' in common/characters/<TAG>.txt, or the new common/characters/RR_dual_leaders.txt for the 13 tags with no character file. Names at the end of RR_character_names_l_english.yml, portraits at the end of RR_portraits.gfx. / - 23 existing characters had no GFX_<id> sprite: aliases at the end of interface/dual_leader.gfx. / - ENG, CAN, BRM and the 10 Burmese tags were left as Globus set them. / - The old list and old sprites are still hashed out: delete them once this is checked. / To check / decide: / 1. Entries with no government in the trigger (208 countries, incl. 89 monarchies) now only show for the STARTING government (decided 2026-10-25: keep it; the every-government version is its own task). / 2. Subject triggers dropped: SWA, LES, BOT (is_puppet_of ENG), UAE, IRQ (is_subject_of ENG), PMC (is_subject_of USA) keep their dual leader after independence. / 3. Cosmetic tag triggers dropped: COC Le Van Vien (COC_united_front), ANG Iko Carreira (ANG_REBEL). / 4. Done by script, test in game: USA Vito Marcantonio (rr_on_actions.txt, next to set_country_flag = vito_speaker); FRE Victor Barthelemy (events/RR_FRE.txt rrfrance.3 option a, FRE_doriot_dead, replaces Marcel Deat); GRE Paul I -> Constantine II after 1964.3.6 (new on_monthly at the end of rr_country_changes_on_actions.txt, flag GRE_constantine_dual_leader). / 5. Not converted, the old entry could never show: USA Lyndon B. Johnson (lbj_speaker never set), ADN Ramon Iglesias i Navarri (ADN_restored_bishopric never set), CNS Francisco Franco (Rivera always won), MAD Andre Resampa (Elizabeth II always won; MAD = Elizabeth II now), KAR Mahn Ba Zan (has Globus's Burma ones), PHI Ferdinand Marcos (only as a USA subject; PHI = Diosdado Macapagal). / 6. SRS (Jusuf Muda Dalam) has no history file: nothing set. / 7. BNI and RJS have no set_politics: Elizabeth II set as non-aligned (aut); check the start government. / 8. No portrait in the old list (blank frame kept): SUL_mohammad_jusuf, SUN_suardi_tasrif, UGJ_wongsonegoro, WPA_seth_rumkorem. / 9. Old list mismatches: SKK Lhendup Dorjee (name for every government, portrait only neutrality: used aut); HFO had a portrait but no name (named ''Heavenly Throne'', check); FOB Mari Torni's portrait was listed twice. / 10. Picked by name, check: IJN Sokichi Takagi -> FSM_sokichi_takagi (JAP_sokichi_takagi also exists); JAP_shotaro_ishinomori uses the old picture JAP_Shotaro_Onodera.dds; HKR ''Shiro Watero'' -> JAP_shiro_wataru; SHI -> LON_daniel_villegas; SUD -> EGY_farouk_i; SYM -> YEM_abdul_ismail; KYU -> ENG_keith_stewart. / 11. CNS_jose_antonio_primo_de_rivera is a new ASCII copy of CNS_josé_antonio_primo_de_rivera (an é in a token is risky): maybe rename the original instead. / 12. The old list used original_tag; the variables live on the country, so check civil war / dynamic copies still show their dual leader. / 13. Dropped ''NOT = { has_country_flag = X }'' checks (nothing sets X): SOV_trotsky_dead, FAF_nkrumahs_betrayal, XSM_foreigners_ousted, SIA_monarchy_dominant, TAI_legion_ousted, VIN_americans_curbed, global burned_man (FOL). If any get set later, clear the variable there. / 14. Already before: common/decisions/debug_decisions.txt sets token:BRM_con_yu, a token but not a character (no name / portrait). / (Fixed while converting: JAP_kazusaburo_sato's name said ''Tatsuhiko Shibusawa''.) / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0702§!  Culture: short check_variable ladders pick the first step for everything  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! Short check_variable = { A = B } means A >= B, not equals (see Globus' note in RR_culture_scripted_effects.txt). Ladders that check low to high pick the first step: / - GetAcceptanceImage / GetAcceptanceTooltip (common/scripted_localisation/rr_culture_localisation.txt): check 2 first, so persecuted (4) and adversarial (5) show the PROMOTED icon / tooltip. / - subculture_*_button_visible (minority_click_enabled = <sub>) can show on more than one row. / - language_button_click_enabled and convert_culture_button (subculture_id = ...) in subculture_info_view. / Fix: check_variable = { var = A value = B compare = equals }.\n  §G4d 11h§!  §HRR-0703§!  Culture: setup_cultural_strength's nation if has an empty body  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! RR_culture_scripted_effects.txt ~line 190: the nation `if` has an empty body, so every country adds to and multiplies EVERY culture's strength.\n  §G4d 11h§!  §HRR-0704§!  Culture: setup_cultural_prestige gives every major 50 to every culture  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! Placeholder with no culture check: every major adds 50 to every culture.\n  §G4d 11h§!  §HRR-0705§!  Culture: GetCustomCultureName0 calls a function that doesn't exist  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! It calls (GetCustomCultureNameMaster), but the function is GetCustomCultureNameMaster0.\n  §G4d 11h§!  §HRR-0706§!  Culture: merge the duplicate culture_rgb_setup / religion_rgb_setup effects  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! Only one copy of each loads: / - culture_rgb_setup: RR_culture_religion_colors.txt (newer, 2600 entries) AND RR_culture_scripted_effects.txt ~line 57964 (older, 2030 entries, 35 keys not in the other file). Merge the 35 and delete the old copy. / - religion_rgb_setup: RR_culture_religion_colors.txt AND RR_religion_scripted_effects.txt.\n  §G4d 11h§!  §HRR-0707§!  Culture: switch_subculture_effect doesn't update culture_id / culturegroup_id  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! It moves the subculture between arrays but doesn't update culture_id / culturegroup_id on its states, so the culture map mode keeps the old culture.\n  §G4d 11h§!  §HRR-0709§!  Culture: state 279 is in RR_all_values_setup twice  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! Its arrays get filled twice.\n  §G4d 11h§!  §HRR-0710§!  Culture: state 1298's block in RR_all_values_setup is missing its closing }  §WNormal§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! So 319, 1297, 318, 686 and 1271 sit inside it (it still runs, but fix the braces).\n  §G4d 11h§!  §HRR-0711§!  Culture: fix the state data problems Culture Master lists  §WNormal§!  §g(Culture System, Data, To do)§!\n      §gClaude:§! Culture Master > Tools > Check for problems lists them all: 64 states that don't add up to 5 (e.g. 1358 has norteno icons but sets minority_strength@bajio), subcultures used on the map that aren't in any culture (bogotano, catalan_culture, krymchak, vai), ~38 subcultures missing from global.subcultures, 305 land states with no culture data.\n  §G4d 11h§!  §HRR-0712§!  Culture: sort out the low population states  §WNormal§!  §g(Culture System, Data, To do)§!\n      §gClaude:§! Low population = set_state_flag = low_population_state, one subculture at strength 1 (Absolute); the flag covers the religion too (one religion at strength 1). / - 713 has the flag but two subcultures (coastal_australian 1, new_francien 4): drop the flag or the extra. It also has two religions (jansenism 1, anglican 4); 2302 Kluane Mountains has inuit 1 + anglican 4. / - 2505 (northern_islander) and 1366 (roman) have one subculture at strength 1 but no flag: flag them if they're low population (Culture Master's ''Low population state'' checkbox). / (Fixed 2026-10-12: the 15 low pop states set unpopulated_state, which nothing reads; renamed to low_population_state.)\n  §G4d 10h§!  §HRR-0713§!  🔁 Rework Culture Icons (1 waiting in 🖼 GFX)  §WNormal§!  §g(Art Reviews, Art, To do)§!\n      §gMike:§! 1 culture icons marked for rework: Something about it 1. / They're in 🖼 GFX > 🔁 Needs Rework: claim one there, ✓ Reworked when done. Mark more in Country Master (right-click a portrait) or in GFX (right-click a picture).\n  §G4d 10h§!  §HRR-0714§!  🔁 Rework National Ideas (36 waiting in 🖼 GFX)  §WNormal§!  §g(Art Reviews, Art, To do)§!\n      §gMike:§! 36 national ideas marked for rework: Needs Severe Recorrection 15, Needs Touchup 14, Something about it 5, Looks too AI 2. / They're in 🖼 GFX > 🔁 Needs Rework: claim one there, ✓ Reworked when done. Mark more in Country Master (right-click a portrait) or in GFX (right-click a picture).\n  §G3d 12h§!  §HRR-0892§!  Pakistan  §WNormal§!  §g(Culture System, Culture, To do)§!\n  §G3d 12h§!  §HRR-0893§!  Rajasthan  §WNormal§!  §g(Culture System, Culture, To do)§!\n  §G3d 12h§!  §HRR-0894§!  Southern India  §WNormal§!  §g(Culture System, Culture, To do)§!\n  §G3d 12h§!  §HRR-0895§!  Central India  §WNormal§!  §g(Culture System, Culture, To do)§!\n  §G3d 11h§!  §HRR-0899§!  Gujurat  §WNormal§!  §g(Culture System, Culture, To do)§!\n  §G16h 23m§!  §HRR-0903§!  Restrict IJN and Unit 4444 cores in China  §WNormal§!  §g(Data, To do)§!\n      §gMike:§! From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. IJN: Hainan only. Unit 4444: capital state only. Existing idea IJN/4444 Cores supplies context; review capital boundaries and future integration separately. Source: Dev VC 2026-10-23; proposal for review.\n  §G16h 18m§!  §HRR-0907§!  Review idea: Cult strongholds as centres of conversion  §WNormal§!  §g(Culture System, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Cult strongholds as centres of conversion / Category: Mechanics / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / A state fully converted to a cult could spread it to nearby or eligible overseas states, using cult-specific conditions. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0908§!  Review idea: Chinese refugee-route interactions and ideological rewards  §WNormal§!  §g(China, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Chinese refugee-route interactions and ideological rewards / Category: Mechanics / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Explore interception, closed routes, diversion to 4444, bandit extortion, disease/drug transmission and host-country prestige/manpower/economic/research rewards. The proposed Is Refugee state variable and settlement distance need design. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0909§!  Review idea: Mao uprising linked to Chinese refugees in India  §WNormal§!  §g(China, Content, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Mao uprising linked to Chinese refugees in India / Category: Lore & Alt History / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Explore an uprising once enough Chinese refugees reach India. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0910§!  Review idea: Displaced Chinese warlords that relocate and keep supporting resistance  §WNormal§!  §g(China, Content, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Displaced Chinese warlords that relocate and keep supporting resistance / Category: Lore & Alt History / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Explore persistent refugees, retreating tags, dynamic names, low-compliance or undefended escape routes, and support from exile. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0911§!  Review idea: Agricultural capacity shapes refugee destinations and territorial competition  §WNormal§!  §g(China, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Agricultural capacity shapes refugee destinations and territorial competition / Category: Mechanics / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Western agricultural areas could support more refugees and attract more fighting. Food mechanics are a dependency, not an agreed implementation. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0912§!  Review idea: Single-province IJN naval-yard capital and manpower raiding  §WNormal§!  §g(China, Map, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Single-province IJN naval-yard capital and manpower raiding / Category: Map & Countries / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Explore a naval-yard capital and convoy/puppet manpower sources. Broad IJN core reform is separately proposed as work. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0913§!  Review idea: Unlock deeper Codex lore through playthroughs and achievements  §WNormal§!  §g(Codex, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Unlock deeper Codex lore through playthroughs and achievements / Category: Tools & Workflow / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Basic information appears initially; more lore becomes visible through completed runs, achievements and hidden achievements. Extend existing Lore Master RR-0303 rather than create a duplicate tool task. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0914§!  Review idea: Cross-linked Lore Master entries with reviewed AI drafts and contradiction flags  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Cross-linked Lore Master entries with reviewed AI drafts and contradiction flags / Category: Tools & Workflow / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / People, countries, ideologies, technology and events can share linked entries; preserve dates and intentional contradictions. Ingest suggestions as drafts for human review. Requirements context for existing RR-0303. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G16h 18m§!  §HRR-0915§!  Review idea: Animated cultural revolt progress and outlook-based rebel leadership  §WNormal§!  §g(Culture System, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Animated cultural revolt progress and outlook-based rebel leadership / Category: Mechanics / Posted by Mike. / From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. / Compare a hard hostility trigger against increasing monthly revolt risk, and use outlooks/quirks to shape leadership. Revisit other Paradox revolt systems; no numeric tuning was agreed. Source: Dev VC 2026-10-23; tentative suggestion, no owner or implementation commitment.\n  §G1h 45m§!  §HRR-0916§!  Review idea: Represent consumer goods through its own tech section  §WNormal§!  §g(Tech, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Represent consumer goods through its own tech section / Category: Tech / Posted by Mike. / It would be where all the new developments could come in that would affect things like economy, extra industry, ideology, etc. Wouldn't need as much micro managing as normal tech, as we don't want to overwhelm the player. Split into different ''sectors'' they can have different affects.\n  §G1h 44m§!  §HRR-0917§!  Review idea: National Strategies  §WNormal§!  §g(Tech, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: National Strategies / Category: Tech / Posted by Mike. / Allow states to actively choose a ''Sector'' to invest in. Which encourages growth in that industry specifically.\n  §G1h 43m§!  §HRR-0918§!  Review idea: Capitalist Investment  §WNormal§!  §g(Tech, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Capitalist Investment / Category: Tech / Posted by Mike. / For Capitalist nations, they can't choose a specific sector to focus on, but can invest more into different ones. Over-investment can cause a collapse.\n  §G-1d 22h§!  §HRR-0919§!  Review idea: Preview recruitment-law changes by culture and state  §WNormal§!  §g(Culture System, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Preview recruitment-law changes by culture and state / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Before committing to a cultural recruitment law, show which communities become eligible or ineligible and the estimated manpower change in the states currently controlled. Separate the population eligible to serve from manpower that will actually mobilise, so the preview does not promise instant soldiers. / The current cultural-law effects already calculate recruitment weights from cultural population shares and use the controller's law. This proposal makes that calculation understandable before the player acts, rather than adding another recruitment model. / First version: compare the current law against one proposed law, list the largest affected states and explain assumptions. Mark estimates as provisional where occupation, mobilisation or another modifier changes the final outcome.\n  §G-1d 22h§!  §HRR-0920§!  Review idea: Explain why a migratory band moved, waited or became stranded  §WNormal§!  §g(Culture System, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Explain why a migratory band moved, waited or became stranded / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Give each migratory group a compact itinerary: previous state, current population, next expected movement window and the reason it stayed or moved. When there is no valid destination, distinguish an occupied migratory slot, impassable terrain, homeland restrictions and the absence of an eligible neighbour. / The current system already carries origin and population, checks destinations and moves on a quarterly tick. Expose those existing rules rather than making apparently random movement more complicated. / First version: a last-move summary and one blocked-movement reason in the state panel. Detailed arrival notifications remain optional. Settlement and forced-migration policy stay under RR-0291/RR-0292 rather than being reimplemented here.\n  §G-1d 22h§!  §HRR-0921§!  Review idea: Translation services improve administrative reach without replacing culture  §WNormal§!  §g(Culture System, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Translation services improve administrative reach without replacing culture / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Offer a policy distinction between helping communities interact with the state and replacing their cultural identity. Interpreter training, multilingual administration or translated schooling could improve access to services while retaining the population's culture and home language. More coercive assimilation would remain a separate political choice with separate consequences. / This would give multilingual empires, revolutionary federations and small border states different ways to address language barriers. It should complement the planned literacy-to-fluency terminology review, not turn that rename into an unagreed new mechanic. / First version: one country policy, a simple cost and an explicitly defined administrative benefit. The team must settle how fluency is stored and how it interacts with existing stability and culture systems before broader simulation.\n  §G-1d 22h§!  §HRR-0922§!  Review idea: Explain drug-market shortages with a monthly supply ledger  §WNormal§!  §g(Drug Mechanic, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Explain drug-market shortages with a monthly supply ledger / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Add a short last-month breakdown to the drug-market panel: demand, delivered supply, production losses, unsold stock and the largest reason for any shortage. A comparison with the previous month would show whether a changed plantation yield, supplier allocation or market contest altered the result. / The existing market already separates production, demand, allocation, losses and criminal control. The proposal is a player-facing explanation of those stages, not a new drug route or a second market calculation. / First version: retain one previous monthly summary and display a few attributable changes. Avoid a permanent history for every drug in every state; only keep the detail needed for a useful diagnosis.\n  §G-1d 22h§!  §HRR-0923§!  Review idea: Dual leaders have defined mandates and visible power-sharing disputes  §WNormal§!  §g(Dual Leaders, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Dual leaders have defined mandates and visible power-sharing disputes / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / For selected countries, give the two leaders distinct areas of authority and show how their arrangement works: who controls appointments, who directs economic policy, and which decisions need agreement. A dispute should present a concrete compromise or constitutional choice rather than merely apply a random stability penalty. / Keep simple dual-leader countries as two portraits unless their lore supports a deeper arrangement. This extends the existing character-based presentation; it is not a replacement for the remaining conversion and government-role checks under RR-0683/RR-0700/RR-0701. / First version: one agreed country, two policy domains and one scripted dispute with a clear resolution. Define absence, succession and civil-war behaviour before making the framework reusable.\n  §G-1d 22h§!  §HRR-0924§!  Review idea: Repeated time-bomb discoveries create an aftermath and international attention  §WNormal§!  §g(Time Bombs, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Repeated time-bomb discoveries create an aftermath and international attention / Category: Time Bombs / Posted by Chat Jipity. / Suggested by Chat Jipity. / After an expedition changes a place or reveals an anomaly, leave a small persistent aftermath: an unresolved site, displaced witnesses, a research restriction or a diplomatic concern. Repeated discoveries could attract foreign observers, rival expeditions and demands for disclosure. / Let the player distinguish containment, controlled investigation and public exploitation. Attention should unlock authored choices rather than automatically spiral into an unavoidable global catastrophe. / First version: one existing expedition, one aftermath record and two possible follow-up reactions. This concerns consequences after discovery; the crystal-search loop remains the separate Explorer Mechanic idea and RR-0164.\n  §G-1d 22h§!  §HRR-0925§!  Review idea: Antarctic bases cooperate through a shared rescue and emergency network  §WNormal§!  §g(Antarctica, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Antarctic bases cooperate through a shared rescue and emergency network / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Give Antarctic bases a reason to cooperate even when their sponsors are rivals. A station with rescue capacity could help an isolated expedition, negotiate reciprocal access or withhold assistance at a political cost. Severe weather and supply interruptions would create occasional authored emergencies rather than constant equipment micro-management. / Participation could grant a limited safety benefit and diplomatic credibility, while exposing information about otherwise secret research or military facilities. This adds an interaction between bases rather than duplicating tourism income, ownership or fishing proposals. / First version: two bases, one rescue incident and a small cooperation agreement. Match the final ownership framework before introducing extra Antarctic tags.\n  §G-1d 22h§!  §HRR-0926§!  Review idea: The Codex explains a country's current mechanical pressures  §WNormal§!  §g(Codex, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: The Codex explains a country's current mechanical pressures / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Add a brief Current Situation page that explains the most important active pressures on the selected country: for example, a divided leadership, an integration obstacle or dependence on an external supplier. Each explanation should identify its source system and point to the relevant interface or decision. / Use authored conditional text assembled from known game state, not an AI service generating live campaign explanations. Keep confirmed mechanical facts separate from flavour written as an unreliable in-world report. / First version: a few explanations for the China-first release. Essential rules remain available without achievement unlocks; this complements rather than duplicates the Lore Master and deeper-lore discovery proposals.\n  §G-1d 22h§!  §HRR-0927§!  Review idea: Captured landmarks offer stewardship choices instead of automatic full legitimacy  §WNormal§!  §g(Landmarks, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Captured landmarks offer stewardship choices instead of automatic full legitimacy / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / For politically significant landmarks, distinguish physical possession from local recognition. An occupier could preserve local management, sponsor restoration or impose a new official interpretation, with different costs and local reactions. Control of the site would not automatically confer every cultural or political benefit associated with it. / The current landmark framework already has upgrades and effects transferred after state control changes. Add a limited stewardship layer to selected sites, not a new bespoke event chain for every landmark. / First version: one site with a clear contested meaning, two stewardship choices and defined behaviour when control changes again. Keep ordinary industrial landmarks simple where this distinction adds little.\n  §G-1d 22h§!  §HRR-0928§!  Review idea: Keep an implementation-status register for active, prototype and disabled systems  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Keep an implementation-status register for active, prototype and disabled systems / Category: Tools & Workflow / Posted by Chat Jipity. / Suggested by Chat Jipity. / Give major systems a concise record of their implementation status, source entry points, known dependencies and last verified game version. Distinguish active, experimental, disabled pending redesign and retired content. A surviving interface or documentation file should not by itself mark a mechanic as playable. / This would make reviews and handovers more reliable: the ecology, radiation and score/card hooks are currently disabled while their scripts still exist, and historical issue notes can lag behind fixes. / First version: a small reviewed registry linked from existing documentation and tool search. Code-derived hints may flag a possible change, but only a person or a recorded test should certify a status. This is documentation/visibility, not an automatic switch that enables mechanics.\n  §G-1d 22h§!  §HRR-0929§!  Review idea: Use small regression scenarios for interactions between RR systems  §WNormal§!  §g(Tools, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Use small regression scenarios for interactions between RR systems / Category: Tools & Workflow / Posted by Chat Jipity. / Suggested by Chat Jipity. / Create a small catalogue of reproducible situations with expected results: a mixed-culture state changes controller; a migratory group moves between states; a supplier loses a production site; a dual leader is replaced. Record what should change immediately, at the next tick and after a save/load. / These scenarios would catch interactions that a syntax checker or error log cannot establish, such as a correct-looking tooltip backed by a stale value. Keep the fixtures small and tied to a specific build and start state. / First version: three cross-system scenarios using documented console steps and expected numerical observations. This complements One-click Test Launch rather than adding a second launcher or claiming full automated game control.\n  §G-1d 22h§!  §HRR-0930§!  Review idea: Model Master shows scheme coverage across equipment and seasonal variants  §WNormal§!  §g(3d Models, Tools, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Model Master shows scheme coverage across equipment and seasonal variants / Category: Tools & Workflow / Posted by Chat Jipity. / Suggested by Chat Jipity. / Add a country coverage view showing which model families and Normal/Snow/Desert appearances have a reviewed recolour applied, which deliberately retain the original look and which have not been checked. Let the artist open a gap directly in the current browser. / Model Master already groups appearances and records applied models. This proposal adds a consistency checklist around those records rather than another model catalogue or a replacement for texture-area review. / First version: one country and one unit class, with explicit Not available for variants that do not exist. Avoid treating every unchanged asset as an error or silently applying a summer scheme to winter clothing.\n  §G-1d 22h§!  §HRR-0931§!  Review idea: Negotiated unions offer a visible charter before ratification  §WNormal§!  §g(Formables, Mechanic, Ready for Review)§!\n      §gMike:§! Review the project idea before deciding whether to implement it. / Idea: Negotiated unions offer a visible charter before ratification / Category: Mechanics / Posted by Chat Jipity. / Suggested by Chat Jipity. / Before a diplomatic union is accepted, show an explicit charter: the new political centre, treatment of local institutions, cultural/religious protections and what happens to constituent forces and debts. The parties should respond to those terms rather than only a single generic acceptance score. / The existing Formables and the Culture System idea decides the broad conquest-versus-diplomacy distinction. This narrower proposal makes a negotiated union's political settlement legible and gives subsequent disputes something concrete to refer back to. / First version: two alternative charter templates for the proposed Central American test case, with clear conditions and one later dispute. Do not add an entire federal administration simulation before the union itself works.\n  §G8d 13h§!  §HRR-0170§!  Mount Rushmore  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Adds baseline support for US Culture\n  §G8d 13h§!  §HRR-0171§!  Crazy Horse  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Starts being built by Sioux as part of the Civil Rights Era. A radical US government can get bonuses by fostering its completion.\n  §G8d 13h§!  §HRR-0172§!  Stone Mountain  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Cannot be destroyed without pissing off all Dixie states, increases rightwing support in the US election, Slows Civil Rights, if owned by Dixie culture increases might\n  §G8d 13h§!  §HRR-0173§!  Wallace Dam  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0174§!  Alaskorp Megamall Planned Community  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0175§!  Sears Tower  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0176§!  The Alamo  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0177§!  Hoover Dam  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases Power, Supports NAWAPA\n  §G8d 13h§!  §HRR-0178§!  Long Dam  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases POwer, Decreases NAWAPA, Increases money\n  §G8d 13h§!  §HRR-0179§!  Area 51  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases Research, upgraded can get an early warning as to who the Aliens types are\n  §G8d 13h§!  §HRR-0180§!  Las Vegas  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases Cultural Power, Can gain watered down bonuses of other monuments\n  §G8d 13h§!  §HRR-0181§!  Hollywood  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases Cultural Power\n  §G8d 13h§!  §HRR-0182§!  Golden Gate Bridge  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Infrastructure Bonus, Middle Class Support Boost\n  §G8d 13h§!  §HRR-0183§!  Golden Gate Fortress  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Infrastructure Bonus, Defence on the Coast, Might Boost\n  §G8d 13h§!  §HRR-0184§!  The Pentagon  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0185§!  Monument to Emancipation  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Created by a Black American nation to commemorate true freedom from any oppressors, gives defence/other resistance modifiers.\n  §G8d 13h§!  §HRR-0186§!  Fort Knox  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0187§!  Ford River Rouge complex  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Starts of increasing lower class support, adds money to the state, degrades over time unless intervened in\n  §G8d 13h§!  §HRR-0188§!  Peace Garden  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Can only be built if the USA and Canada are friendly. Building fosters peace between the United States and Canada, potential unificiation or alliance bonuses?\n  §G8d 13h§!  §HRR-0189§!  White House  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Democratic Support, Maybe allows options for control of the US during collapse you start integrating Democratic breakaways\n  §G8d 13h§!  §HRR-0190§!  Salt Lake City Tabernacle  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Whoever owns it is recognized as a legitimate Mormon standardbearer and can more easily spread Mormonism\n  §G8d 13h§!  §HRR-0191§!  Epcot  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0192§!  Parliament Hill  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Symbolizes Canada's confederation and interacts with Trumpet of the Loyalists idea.\n  §G8d 13h§!  §HRR-0193§!  CN Tower  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Built by a successful Canadian democracy and gives economic buffs.\n  §G8d 13h§!  §HRR-0194§!  L'Anse aux Meadows  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Norse settlement, gives increases to construction and development in rural areas.\n  §G8d 13h§!  §HRR-0195§!  CANZUK monument  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! 2 ways of using: Soft power and ideological focus where paraguay can immunize other nations' states for influence and hard power and might focus where paraguay can infect other nations' states with various diseases to weaken them. Only done after eliminating the Red Wither\n  §G8d 13h§!  §HRR-0196§!  La Tortuga  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0197§!  Chichen Itza  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Can be assimilated into Mexican culture, but otherwise gives buffs to Mayan culture nations.\n  §G8d 13h§!  §HRR-0198§!  Torre Latinoamericana  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0199§!  Portal to Hell  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Spawned if the Devil taking control of Honduras reaches its totality, gives powerful might bonuses but is weak to religion at first\n  §G8d 13h§!  §HRR-0200§!  Palacio Bolivar  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Can be upgraded by a pan-Latin American state, and gives boosts towards integrating Latin American cultures and areas.\n  §G8d 13h§!  §HRR-0201§!  Panama Canal  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Built by the Panama Canal Company, and gives boosts to economy and tourism.\n  §G8d 13h§!  §HRR-0202§!  Colossus of Nicaragua  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Built by the Nicaragua Canal Company, giving modifiers to prestige and loyalty, building it instantly hurts the Panamanians\n  §G8d 13h§!  §HRR-0203§!  Masoleum of Che Guevara  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! If Che Guevara dies, the country he was under can build a masoleum, granting ideological and cultural benefits\n  §G8d 13h§!  §HRR-0204§!  Guantanamo Bay  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Cuba can lease out it should they retain it, country that is leasing pays money and recieves a stability boost\n  §G8d 13h§!  §HRR-0205§!  Sans-Souci Palace  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Can be upgraded by several Haitian paths to provide several modifiers, otherwise gives defensive boosts.\n  §G8d 13h§!  §HRR-0206§!  Macchu Picchu  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Grants cultural and benefits in mountain regions. Benefits can be unlocked by a Peruvian government that does cultural synthesis\n  §G8d 13h§!  §HRR-0207§!  Potosí Mines  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Grants resource production bonuses and production modifiers in the state and nationally.\n  §G8d 13h§!  §HRR-0208§!  El Obelisco  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Grants prestige nationally and gives boosts to the state of Buenos Aires.\n  §G8d 13h§!  §HRR-0209§!  Christ the Redeemer  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0210§!  Shrine to the Cosmic Race  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Would replace Christ the Redeemer\n  §G8d 13h§!  §HRR-0211§!  Americaville  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Can spread Confederate or Amero-rican culture (kind of like how protestants spread in eu4)\n  §G8d 13h§!  §HRR-0212§!  Paraguian Research Center for Disease Mastery  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0213§!  Hagia Sophia  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0214§!  European Parliament  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0215§!  The City of Revolution  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Not real at start, gained at end of the path.\n  §G8d 13h§!  §HRR-0216§!  Palace of the Romanovs  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Adds Might, Allows recruitment of Special units, upgradable more times than usual, massive negatives to economy but increases claim\n  §G8d 13h§!  §HRR-0217§!  Palace of the Proletariat  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Exalted city of the proletariat, beacon of power in the regime.\n  §G8d 13h§!  §HRR-0218§!  Vorkuta  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0219§!  Norilsk  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0220§!  Lenin's Mausoleum  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0221§!  Adler Statue  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Hitlerian points +1111. Perhaps if Britain is fascist they can recruit special troops.\n  §G8d 13h§!  §HRR-0222§!  Stonehenge  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0223§!  Bletchley Park  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Decryption and Spy Bonuses\n  §G8d 13h§!  §HRR-0224§!  Bank of England  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0225§!  HMNB Portsmouth  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0226§!  Edinburgh Castle  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0227§!  North Sea Oil Hub  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Gives Oil to to the UK\n  §G8d 13h§!  §HRR-0228§!  Commonwealth Victory Monument  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0229§!  The Irish Hunger Memorial  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Increases Ties with the US, Canada, Australia, New Zealand. Increased Defence on Core Territory.\n  §G8d 13h§!  §HRR-0230§!  Holy Stone of Clonrichert  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0231§!  World's Fair  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Migrates every 5 years, gives no buffs initially and is a big drain on the economy. However, it can repay itself massively if you get a bunch of countries to come and invest in exhibitions. It will give the full buffs for the duration of the fair. After the fair is over it will give a few lingering buffs and be renamed to 'Former World's Fairgrounds'.\n  §G8d 13h§!  §HRR-0232§!  Casino de Monte-Carlo  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0233§!  Hall of the Federation  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Built as the meeting place of the leaders of the various members of the South African Federation. Grants various bonuses that can be decided upon by different meetings that take place there from economic to ideological and military.\n  §G8d 13h§!  §HRR-0234§!  Voertrekker Monument  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Rapid culture conversion on non-core provinces.\n  §G8d 13h§!  §HRR-0235§!  Transmaterial Pit of Violence  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Monthly manpower loss, might gain, military bonuses, sacrifice more manpower for military buffs\n  §G8d 13h§!  §HRR-0236§!  Bathurst Commemorative Fortress  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Only built upon victory in the war\n  §G8d 13h§!  §HRR-0237§!  East Rand Special Economic Mining Zone  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Gives a massive boost to diamond gain in the state, but CHEWS through manpower.\n  §G8d 13h§!  §HRR-0238§!  N'ajjer Petroglyph Fields  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0239§!  Berengo  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! If Bokassa takes power, grand palace is built, grants might and other buffs proportional to how upgraded it is\n  §G8d 13h§!  §HRR-0240§!  Memorial of the Armenian Genocide  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! While active Turkey has a harder time dealing with Communists and Democrats\n  §G8d 13h§!  §HRR-0241§!  Angkor Wat  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! If you're cambodian and buddhist you get religious buffs, if you're communist, you get ideological loyalty\n  §G8d 13h§!  §HRR-0242§!  Petra  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0243§!  Potala Palace  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Owning the Potala Palace grants support for autocracy and spreading Buddhist religion. Can be converted by an outsider force into a Monument of Peaceful Liberation\n  §G8d 13h§!  §HRR-0244§!  Guangshou Stock Market  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0245§!  Dr. Sun Research Complex  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0246§!  The Jade Palace  §gLow§!  §g(Landmarks, Landmark, To do)§!\n  §G8d 13h§!  §HRR-0247§!  First Established Base (name changes depending)  §gLow§!  §g(Landmarks, Landmark, To do)§!\n      §gMike:§! Research Buff, Buff to Antartica Mechanic, Buff to Cold Acclimatisation\n  §G7d 5h§!  §HRR-0282§!  Clean Up UK's Alliance  §gLow§!  §g(Polish, Bug, To do, ENG)§!\n      §gMike:§! UK's Alliance + Puppet list is unreadable. If possible we should change this to be a single icon of ''British Empire''.\n  §G7d 0h§!  §HRR-0292§!  Forced Migration  §gLow§!  §g(Culture System, Mechanic, To do)§!\n      §gMike:§! Ability to kick Migratory groups outside of your country. Interaction if another state pushes theirs out into yours. Shouldn't be super easy (I.E the UK can't just kick out all the Roma as a democracy).\n  §G7d 0h§!  §HRR-0293§!  General Migratory Interactions  §gLow§!  §g(Culture System, Culture, To do)§!\n      §gMike:§! Schooling, Health, Economy within bands. Benefits/Negatives relating to these (High economic Bands will provide economic bonuses).\n  §G6d 16h§!  §HRR-0305§!  UI change for the Codex  §gLow§!  §g(Codex, Art, To do)§!\n  §G4d 11h§!  §HRR-0694§!  Rework the USSR overmap (scrapped for now)  §gLow§!  §g(Soviet Union, Mechanic, To do)§!\n      §gClaude:§! Old USSR overmap GUI: interface/RR_special_mechanic.gfx / .gui, common/scripted_localisation/rr_soviet_localisation.txt. To be reformed later. / Known missing art (ignored until the rework): USSR_overmap_Romania_nobucovina_happy/_mixed/_angry, USSR_overmap_Turkmen_normal_bg (gfx/interface/USSR_GUI/Overmap/). / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0695§!  Redo the Ecology mechanic (hashed out)  §gLow§!  §g(Misc Mechanics, Mechanic, To do)§!\n      §gClaude:§! Hashed out 2026-10-12: every line commented out (#), each file has a ''#### HASHED OUT'' note on top; un-hash by removing the leading # from each line. / What it was: state ecological damage (0-100) with monthly decay; damage gave building repair, manpower, supply and resistance maluses; icon + tooltip in the state view. / Files: common/dynamic_modifiers/rr_ecology_dynamic_modifiers.txt, common/modifier_definitions/RR_ecology_modifiers_definition.txt, common/on_actions/rr_ecology_on_actions.txt, common/scripted_effects/RR_ecology_scripted_effects.txt, common/scripted_guis/RR_ecology_mechanics.txt, interface/RR_ecology_mechanics.gui, localisation/english/RR_ecology_mechanics_l_english.yml. / Shared with Nuclear: common/scripted_triggers/RR_monthly_tick_triggers.txt (the once-a-month gate; keep that pattern: on_monthly fires once per country, not once per month). / Also hashed, un-hash with it: common/decisions/debug_decisions.txt force_eco_decay; common/ideas/RR_botswana.txt national_ecological_damage_decay = 1 (BOT_hunting_of_bechuanaland, its tooltip still mentions ''ecological chaos''); the *_ecological_damage_decay tokens in common/synchronized_dynamic_tokens/tokens.txt. GFX_ecological_damage_icon in interface/countrystateview.gfx was left in place. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0696§!  Redo the Nuclear radiation mechanic (hashed out)  §gLow§!  §g(Tech, Mechanic, To do)§!\n      §gClaude:§! Hashed out 2026-10-12 (see the Ecology task for how to un-hash). / What it was: on_nuke_drop added state radiation, which decayed monthly; icon + tooltip in the state view. Vanilla nukes still work (common/raids/nuclear_raids.txt and the nuclear special projects were left alone). / Files: common/dynamic_modifiers/rr_nuclear_dynamic_modifiers.txt, common/modifier_definitions/RR_radiation_modifiers_definition.txt, common/on_actions/rr_nuclear_on_actions.txt, common/scripted_effects/RR_nuclear_scripted_effects.txt, common/scripted_guis/RR_nuclear_mechanics.txt, interface/RR_nuclear_mechanics.gui, localisation/english/RR_nuclear_mechanics_l_english.yml. / Shared with Ecology: common/scripted_triggers/RR_monthly_tick_triggers.txt. Also hashed: force_rad_decay in common/decisions/debug_decisions.txt and the *_radiation_decay tokens in common/synchronized_dynamic_tokens/tokens.txt. GFX_modifiers_radiation in interface/countrystateview.gfx was left in place. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0697§!  Redo the Score (cards) mechanic (hashed out)  §gLow§!  §g(Misc Mechanics, Mechanic, To do)§!\n      §gClaude:§! Hashed out 2026-10-12 (see the Ecology task for how to un-hash). / What it was: a card panel on the politics tab (8 cards, pick / reshuffle / discard, weekly reward check). / Files: common/on_actions/rr_score_on_actions.txt, common/scripted_effects/RR_score_scripted_effects.txt, common/scripted_guis/RR_score_mechanics.txt, common/scripted_triggers/RR_score_scripted_triggers.txt, common/scripted_localisation/rr_score_localisation.txt, interface/RR_score_mechanics.gfx / .gui, localisation/english/RR_score_mechanics_l_english.yml. / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0701§!  Dual leaders: give the converted ones their other governments too  §gLow§!  §g(Dual Leaders, Data, To do)§!\n      §gClaude:§! Parked, not done. The old list showed a dual leader whose trigger named no government under EVERY government; the conversion gave them only the starting government. If a country should keep its dual leader after a government change, give it the other slots too. / Countries: 208 of those with a ''# converted from the old dual leader list'' block in history/countries (the 89 monarchies with has_british/savoy/belgian/dutch/danish_monarchy are a big part). / Per country: / - Decide which other governments make sense (a monarch under communism usually doesn't: skip those). / - Add set_variable = { dual_leader_<dem|com|aut|nat> = token:<same id> } for each, under the existing line. Don't overwrite a government that already has its own (e.g. YOK, NVK and the other Japanese breakaways have all four). / - Monarchies: clear the variables where the monarchy is dropped (on_monarchy_dropped in common/on_actions/rr_country_changes_on_actions.txt clears has_british_monarchy for WIF; add clear_variable = dual_leader_<gov> there). / (Moved from Templates/AI_Notes/To_Do.txt.)\n  §G4d 11h§!  §HRR-0708§!  Culture: small leftovers (old naming, duplicate properties, missing GUI element)  §gLow§!  §g(Culture System, Bug, To do)§!\n      §gClaude:§! change_subculture_to_self_culture_effect and GetAllSubcultures use the old global.culture_group_X naming (+ a ''shiting'' typo) and look dead; language_info_view has two properties blocks; rr_primary_subculture_text_visible points at a GUI element that doesn't exist.\n  §G16h 21m§!  §HRR-0906§!  Implement emergent Wuhan revolutionary and Lei Feng cults  §gLow§!  §g(China, Culture, To do)§!\n      §gMike:§! From the Dev VC 2026-10-23  Claude Says: Genocide the Chinese. No starting cult population. Lei Feng dying creates his cult even in defeat; clarify its relationship to Cult of the Revolution before coding. Source: Dev VC 2026-10-23; proposal for review.\n\n§BNeeds Planning§!\n  §G8d 23h§!  §HRR-0106§!  Create Formables  §WNormal§!  §g(Formables, Content, To do)§!\n      §gMike:§! The formables of the RR spreadsheet (Formables tab).\n  §G8d 20h§!  §HRR-0160§!  Time Bombs  §WNormal§!  §g(Time Bombs, Content, To do, Sweep)§!\n  §G8d 20h§!  §HRR-0161§!  Reality Bombs  §WNormal§!  §g(Time Bombs, Content, To do, Sweep)§!\n  §G8d 20h§!  §HRR-0162§!  Myth Bombs  §WNormal§!  §g(Time Bombs, Content, To do, Sweep)§!\n  §G6d 17h§!  §HRR-0303§!  Lore Master  §WNormal§!  §g(Tools, Tools, To do)§!\n      §RBlocked:§! Needs the Codex.\n  §G8d 20h§!  §HRR-0164§!  Explorer Mechanic for Finding Crystals  §gLow§!  §g(Time Bombs, Mechanic, Needs Fleshing)§!\n  §G7d 0h§!  §HRR-0291§!  Settling Migratory Cultures  §gLow§!  §g(Culture System, Mechanic, To do)§!\n      §gMike:§! There should be a small mechanic available to ''Settle'' Migratory cultures. This should be in stages, and likely require some investment. Doing so means that population stays in your state (or you can direct them to another state). Depending on the number they'll either add a modifier (to flag that they're there), or replace a pip."
